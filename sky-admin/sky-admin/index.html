<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>苍穹外卖管理系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", sans-serif; }
        .login-container { display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #409EFF 0%, #1890ff 100%); }
        .login-card { width: 420px; padding: 40px; background: #fff; border-radius: 8px; box-shadow: 0 2px 20px rgba(0,0,0,.15); }
        .login-card h2 { text-align: center; color: #409EFF; margin-bottom: 30px; font-size: 24px; }
        .main-container { height: 100vh; display: flex; }
        .sidebar { width: 200px; background: #304156; min-height: 100vh; }
        .sidebar .logo { height: 60px; line-height: 60px; text-align: center; color: #fff; font-size: 18px; font-weight: bold; background: #2b3a4a; }
        .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .topbar { height: 50px; background: #fff; border-bottom: 1px solid #e6e6e6; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .topbar h3 { color: #333; }
        .content { flex: 1; padding: 20px; background: #f0f2f5; overflow-y: auto; }
        .search-bar { background: #fff; padding: 20px; border-radius: 4px; margin-bottom: 20px; }
        .table-card { background: #fff; padding: 20px; border-radius: 4px; }
        .stat-cards { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: #fff; padding: 20px; border-radius: 4px; text-align: center; }
        .stat-card .num { font-size: 28px; font-weight: bold; color: #409EFF; }
        .stat-card .label { color: #999; margin-top: 5px; }
    </style>
</head>
<body>
<div id="app">
    <router-view></router-view>
</div>

<script src="https://unpkg.com/vue@2.7.14/dist/vue.js"></script>
<script src="https://unpkg.com/element-ui/lib/index.js"></script>
<script src="https://unpkg.com/axios@1.6.2/dist/axios.min.js"></script>
<script src="https://unpkg.com/vue-router@3.6.5/dist/vue-router.min.js"></script>
<script src="https://unpkg.com/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="src/app.js"></script>
</body>
</html>
